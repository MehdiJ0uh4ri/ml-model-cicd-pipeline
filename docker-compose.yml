# The full loop, locally: tracking server, inference service, metrics, dashboards.
# `make up` then open http://localhost:3000 (Grafana) and :5000 (MLflow).

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  inference:
    build:
      context: .
      dockerfile: serving/Dockerfile
    ports: ["8080:8080"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REGISTRY_BACKEND: local
      SERVING_MODE: "off"
      SHADOW_LOG: /app/artifacts/shadow_log.jsonl
    volumes:
      # The registry is mounted rather than baked in: promoting a model from
      # the host is immediately visible to the container after /admin/reload.
      - ./registry:/app/registry:ro
      - ./artifacts:/app/artifacts
    depends_on:
      mlflow:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [inference]

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on: [prometheus]

volumes:
  mlflow-data:
